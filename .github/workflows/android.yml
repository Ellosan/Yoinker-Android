name: Build APK

on:
  push:
    branches: ["main", "claude/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Install the build platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APKs
        # Phones only: the universal and x86_64 builds are for emulators, and each
        # one carries its own copy of python and ffmpeg.
        run: ./gradlew assembleDebug -Pyoinker.universalApk=false --no-daemon

      - name: Check it
        run: ./gradlew lintDebug --no-daemon

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: yoinker-debug-apks
          path: |
            app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
            app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk
          if-no-files-found: error
