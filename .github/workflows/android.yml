name: Build APK

on:
  push:
    branches: ["main", "claude/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 21, not 17: the Paparazzi plugin that renders the design needs it. The app
      # itself still compiles to JVM 17 bytecode — that's set in the build file.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      # No setup-android action here on purpose. It insists on installing "tools",
      # a package Google removed from the SDK repository, which broke this build
      # without a line of ours changing. The runner image already ships an SDK —
      # all it needs is the platform we compile against.
      - name: Install the build platform
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)
          if [ -z "$SDKMANAGER" ]; then
            echo "No sdkmanager under $SDK/cmdline-tools" >&2
            exit 1
          fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APKs
        # Phones only: the universal and x86_64 builds are for emulators, and each
        # one carries its own copy of python and ffmpeg.
        run: ./gradlew assembleDebug -Pyoinker.universalApk=false --no-daemon

      - name: Check it
        run: ./gradlew testDebugUnitTest lintDebug --no-daemon

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: yoinker-debug-apks
          path: |
            app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
            app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk
          if-no-files-found: error
